# webhook-gw: the only thing the cloudflared tunnel can reach (docs/DECISIONS.md AD3).
# It forwards POST /webhook/loan-match (Workflow B's production webhook) to n8n and answers
# 404 for everything else, so the n8n editor, REST API and test webhooks are never exposed.
# The path is a fixed constant shared with Workflow B and the notify Lambda.

server {
    listen 80;
    server_tokens off;
    client_max_body_size 16k;

    # Resolve n8n per request through Docker's DNS, so an n8n restart (new container IP)
    # doesn't leave nginx pointing at a stale address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $n8n_upstream http://n8n:5678;

    location = /webhook/loan-match {
        limit_except POST {
            deny all;
        }
        proxy_pass $n8n_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
